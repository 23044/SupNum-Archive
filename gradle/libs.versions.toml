# Versions Section
[versions]
androidGradlePlugin = "8.4.0"
firebaseBom = "33.12.0"
firebaseAnalytics = "21.0.0"
firebaseAuth = "21.0.0"
firebaseFirestore = "24.0.0"
firebaseStorage = "20.0.0"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.1"
constraintLayout = "2.2.1"
junit = "4.13.2"
espressoCore = "3.6.1"
kotlinVersion = "1.8.0"

# Plugins Section
[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
google-services = { id = "com.google.gms.google-services", version = "4.3.15" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlinVersion" }

# Libraries Section
[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
activity = { module = "androidx.activity:activity", version.ref = "activity" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintLayout" }
junit = { module = "junit:junit", version.ref = "junit" }
ext-junit = { module = "androidx.test.ext:junit", version.ref = "junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espressoCore" }

# Firebase libraries under Libraries section
firebaseBom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebaseAnalytics = { module = "com.google.firebase:firebase-analytics", version.ref = "firebaseAnalytics" }
firebaseAuth = { module = "com.google.firebase:firebase-auth", version.ref = "firebaseAuth" }
firebaseFirestore = { module = "com.google.firebase:firebase-firestore", version.ref = "firebaseFirestore" }
firebaseStorage = { module = "com.google.firebase:firebase-storage", version.ref = "firebaseStorage" }
